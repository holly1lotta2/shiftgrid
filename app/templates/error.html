{% extends "base.html" %}
{% block title %}Ошибка {{ code }}{% endblock %}
{% block content %}
<div class="card mx-auto text-center" style="max-width: 520px;">
  <div class="card-body p-5">
    <div class="display-4 fw-bold text-primary">{{ code }}</div>
    <h1 class="h4 mt-2">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">На главную</a>
  </div>
</div>
{% endblock %}
